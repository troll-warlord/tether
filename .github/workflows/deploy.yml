name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /tether/

      - name: Deploy dist/ to live branch
        run: |
          cd dist

          # Configure git identity for the commit
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage everything in dist/
          git add -A

          # Create a single orphan commit (no history baggage)
          git commit -m "deploy: $(date -u +'%Y-%m-%dT%H:%M:%SZ') @ ${{ github.sha }}"

          # Force-push to the live branch (orphan — no shared history with main)
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:live
